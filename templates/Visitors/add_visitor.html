{% extends "base.html" %}

{% block title %}Register Visitor{% endblock %}
{% block topbar_title %}Register Visitor{% endblock %}

{% block content %}

<div class="form-page-narrow">
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        New Visitor
      </span>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('visitors.add_visitor') }}">

        <div class="form-group">
          <label class="form-label">Full Name<span class="required">*</span></label>
          <input type="text" name="full_name" class="form-control" required placeholder="e.g. Mary Johnson">
        </div>

        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" name="phone" class="form-control" placeholder="e.g. 0770 123 456">
        </div>

        <div class="form-group">
          <label class="form-label">Visit Date</label>
          <input type="date" name="visit_date" class="form-control" value="{{ today }}">
        </div>

        <div class="form-group">
          <label class="form-label">Invited By</label>
          <input type="text" name="invited_by" class="form-control" placeholder="Member who invited them (optional)">
        </div>

        <div class="divider"></div>

        <div style="display:flex; gap:var(--space-3); justify-content:flex-end;">
          <a href="{{ url_for('visitors.visitor_list') }}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Register Visitor
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
