{% extends "base.html" %}

{% block title %}Upload Document{% endblock %}
{% block topbar_title %}Upload Document{% endblock %}

{% block content %}

<div class="form-page-narrow">
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Upload Document
      </span>
    </div>

    <div class="card-body">
      <form method="POST" enctype="multipart/form-data" action="{{ url_for('documents.upload_document') }}">

        <div class="form-group">
          <label class="form-label">Title<span class="required">*</span></label>
          <input type="text" name="title" class="form-control" required placeholder="e.g. March Board Meeting Minutes">
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select name="category" class="form-control">
            {% for cat in categories %}
            <option value="{{ cat }}" {% if cat == 'General' %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">File<span class="required">*</span></label>
          <input type="file" name="file" class="form-control" required accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg">
          <p class="form-hint">Accepted: PDF, Word, Excel, JPG, PNG.</p>
        </div>

        <div class="divider"></div>

        <div style="display:flex; gap:var(--space-3); justify-content:flex-end;">
          <a href="{{ url_for('documents.document_list') }}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Upload
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
