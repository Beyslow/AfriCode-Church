{% extends "base.html" %}

{% block title %}New Service{% endblock %}
{% block topbar_title %}New Service{% endblock %}

{% block content %}

<div class="form-page-narrow">
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>
        </svg>
        New Service
      </span>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('attendance.create_service') }}">

        <div class="form-group">
          <label class="form-label">Service Date<span class="required">*</span></label>
          <input type="date" name="service_date" class="form-control" required value="{{ today }}">
        </div>

        <div class="form-group">
          <label class="form-label">Service Type</label>
          <select name="service_type" class="form-control">
            <option value="Sunday" selected>Sunday</option>
            <option value="Midweek">Midweek</option>
            <option value="Special">Special</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Name (optional)</label>
          <input type="text" name="name" class="form-control" placeholder="Leave blank to auto-generate">
          <p class="form-hint">e.g. "Sunday Service — July 05, 2026" will be generated if left empty.</p>
        </div>

        <div class="divider"></div>

        <div style="display:flex; gap:var(--space-3); justify-content:flex-end;">
          <a href="{{ url_for('attendance.service_list') }}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Create & Mark Attendance
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
