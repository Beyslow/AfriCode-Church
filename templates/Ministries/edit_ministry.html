{% extends "base.html" %}

{% block title %}Edit Ministry{% endblock %}
{% block topbar_title %}Edit Ministry{% endblock %}

{% block content %}

<div class="form-page-narrow">
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit {{ ministry.name }}
      </span>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('ministries.edit_ministry', ministry_id=ministry.id) }}">

        <div class="form-group">
          <label class="form-label">Ministry Name<span class="required">*</span></label>
          <input type="text" name="name" class="form-control" required value="{{ ministry.name }}">
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control">{{ ministry.description or '' }}</textarea>
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Meeting Day</label>
            <select name="meeting_day" class="form-control">
              <option value="" {% if not ministry.meeting_day %}selected{% endif %}>Select…</option>
              {% for day in ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}
              <option value="{{ day }}" {% if ministry.meeting_day == day %}selected{% endif %}>{{ day }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Meeting Time</label>
            <input type="time" name="meeting_time" class="form-control" value="{{ ministry.meeting_time or '' }}">
          </div>
        </div>

        <div class="divider"></div>

        <div style="display:flex; gap:var(--space-3); justify-content:flex-end;">
          <a href="{{ url_for('ministries.ministry_detail', ministry_id=ministry.id) }}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Save Changes
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
