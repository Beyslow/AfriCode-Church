{% extends "base.html" %}

{% block title %}New Ministry{% endblock %}
{% block topbar_title %}New Ministry{% endblock %}

{% block content %}

<div class="form-page-narrow">
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        New Ministry
      </span>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('ministries.add_ministry') }}">

        <div class="form-group">
          <label class="form-label">Ministry Name<span class="required">*</span></label>
          <input type="text" name="name" class="form-control" required placeholder="e.g. Choir, Ushering, Youth">
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" placeholder="Optional"></textarea>
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Meeting Day</label>
            <select name="meeting_day" class="form-control">
              <option value="">Select…</option>
              <option value="Sunday">Sunday</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Meeting Time</label>
            <input type="time" name="meeting_time" class="form-control">
          </div>
        </div>

        <div class="divider"></div>

        <div style="display:flex; gap:var(--space-3); justify-content:flex-end;">
          <a href="{{ url_for('ministries.ministry_list') }}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Create Ministry
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
