{% extends "base.html" %}

{% block title %}Edit Member{% endblock %}
{% block topbar_title %}Edit Member{% endblock %}

{% block content %}

<div class="form-page">
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit {{ member.full_name }}
      </span>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('members.edit_member', member_id=member.id) }}">

        <div class="form-group">
          <label class="form-label">Full Name<span class="required">*</span></label>
          <input type="text" name="full_name" class="form-control" required value="{{ member.full_name }}">
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" name="phone" class="form-control" value="{{ member.phone or '' }}">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ member.email or '' }}">
          </div>
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-control">
              <option value="" {% if not member.gender %}selected{% endif %}>Select…</option>
              <option value="Male" {% if member.gender == 'Male' %}selected{% endif %}>Male</option>
              <option value="Female" {% if member.gender == 'Female' %}selected{% endif %}>Female</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input type="date" name="date_of_birth" class="form-control"
                   value="{{ member.date_of_birth.strftime('%Y-%m-%d') if member.date_of_birth else '' }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" name="address" class="form-control" value="{{ member.address or '' }}">
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Marital Status</label>
            <select name="marital_status" class="form-control">
              <option value="" {% if not member.marital_status %}selected{% endif %}>Select…</option>
              <option value="Single"   {% if member.marital_status == 'Single' %}selected{% endif %}>Single</option>
              <option value="Married"  {% if member.marital_status == 'Married' %}selected{% endif %}>Married</option>
              <option value="Widowed"  {% if member.marital_status == 'Widowed' %}selected{% endif %}>Widowed</option>
              <option value="Divorced" {% if member.marital_status == 'Divorced' %}selected{% endif %}>Divorced</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Occupation</label>
            <input type="text" name="occupation" class="form-control" value="{{ member.occupation or '' }}">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Emergency Contact</label>
          <input type="text" name="emergency_contact" class="form-control" value="{{ member.emergency_contact or '' }}">
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Join Date</label>
            <input type="date" name="join_date" class="form-control"
                   value="{{ member.join_date.strftime('%Y-%m-%d') if member.join_date else '' }}">
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select name="status" class="form-control">
              <option value="Active"   {% if member.status == 'Active' %}selected{% endif %}>Active</option>
              <option value="Inactive" {% if member.status == 'Inactive' %}selected{% endif %}>Inactive</option>
            </select>
          </div>
        </div>

        <div class="divider"></div>

        <div style="display:flex; gap:var(--space-3); justify-content:flex-end;">
          <a href="{{ url_for('members.member_profile', member_id=member.id) }}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Save Changes
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
