{% extends "base.html" %}

{% block title %}Add Member{% endblock %}
{% block topbar_title %}Add Member{% endblock %}

{% block content %}

<div class="form-page">
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
        New Member
      </span>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('members.add_member') }}">

        <div class="form-group">
          <label class="form-label">Full Name<span class="required">*</span></label>
          <input type="text" name="full_name" class="form-control" required placeholder="e.g. Grace Kollie">
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" name="phone" class="form-control" placeholder="e.g. 0770 123 456">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com">
          </div>
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-control">
              <option value="">Select…</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input type="date" name="date_of_birth" class="form-control">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" name="address" class="form-control" placeholder="Street, community, city">
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Marital Status</label>
            <select name="marital_status" class="form-control">
              <option value="">Select…</option>
              <option value="Single">Single</option>
              <option value="Married">Married</option>
              <option value="Widowed">Widowed</option>
              <option value="Divorced">Divorced</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Occupation</label>
            <input type="text" name="occupation" class="form-control" placeholder="e.g. Teacher">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Emergency Contact</label>
          <input type="text" name="emergency_contact" class="form-control" placeholder="Name and phone number">
        </div>

        <div class="form-row form-row-2">
          <div class="form-group">
            <label class="form-label">Join Date</label>
            <input type="date" name="join_date" class="form-control" value="{{ today }}">
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select name="status" class="form-control">
              <option value="Active" selected>Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="divider"></div>

        <div style="display:flex; gap:var(--space-3); justify-content:flex-end;">
          <a href="{{ url_for('members.member_list') }}" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Save Member
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

{% endblock %}
